name: Transfermarkt Daily Scraper

on:
  schedule:
    # Run daily at 03:00 UTC (06:00 EAT) - before main scrape
    - cron: '0 3 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  transfermarkt-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: pip install -r requirements.txt
        working-directory: ./scripts/py
      
      - name: Install Playwright browsers
        run: playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_INSTALL: true
      
      - name: Run Transfermarkt daily scraper
        run: python transfermarkt_scraper.py
        working-directory: ./scripts/py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit and push cache updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transfermarkt_cache.json scripts/ts/transfermarkt_queue.json
          git diff --staged --quiet || git commit -m "chore: update transfermarkt cache $(date -u +'%Y-%m-%d')"
          git push