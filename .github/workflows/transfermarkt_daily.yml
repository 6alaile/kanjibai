name: Transfermarkt Daily Scraper

on:
  schedule:
    # Run daily at 03:00 UTC (06:00 EAT) - before main scrape
    - cron: '0 3 * * *'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  transfermarkt-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/ts/package-lock.json
      
      - name: Install dependencies
        run: npm ci
        working-directory: ./scripts/ts
      
      - name: Run Transfermarkt daily scraper
        run: npx tsx transfermarkt_daily.ts
        working-directory: ./scripts/ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Commit and push cache updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/transfermarkt_cache.json scripts/ts/transfermarkt_queue.json
          git diff --staged --quiet || git commit -m "chore: update transfermarkt cache $(date -u +'%Y-%m-%d')"
          git push