name: Scout Daily Scan

on:
  schedule:
    # 09:00 EAT = 06:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install
        env:
          PLAYWRIGHT_BROWSERS_INSTALL: true

      - name: Run Scout pipeline
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SCOUT_DATE: ""
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          eat = timezone(timedelta(hours=3))
          today = datetime.now(eat).strftime('%Y-%m-%d')
          print(f'Running scan for EAT date: {today}')
          with open('scout_date.txt','w') as f: f.write(today)
          "
          python scripts/main.py

      - name: Commit enriched.json
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add enriched.json
          git diff --staged --quiet || git commit -m "chore: daily scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
